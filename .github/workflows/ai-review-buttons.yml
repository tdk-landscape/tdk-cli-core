# Appends AI review links (Grok, Claude, Codex) to pull request bodies.
# Markdown shields only: no API call, no review comment.
# pull_request_target is allowed only because checkout is the default branch
# and the only write is the PR body. Do not checkout the PR head and do not
# run PR code in this job.
name: 🤖 AI review buttons

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read

# Serialize writes per PR: two `edited` events cannot PATCH in parallel.
concurrency:
  group: ai-review-buttons-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  append:
    name: Append AI review buttons
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # No same-repo if. Forks are covered because this event runs the workflow
    # from the base branch. Do not checkout the PR head and do not run PR code.
    permissions:
      pull-requests: write
    steps:
      # Run the same scripts/ai-review-buttons.mjs contributors test locally
      # (single implementation). Default branch only — never the PR head.
      # persist-credentials: false keeps the job from leaving a write-capable
      # git credential on disk.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Event fields go through env, never into the script string (template-injection safe).
      # Body is fetched with gh so large/multiline bodies are not interpolated into the workflow.
      - name: Append AI review buttons
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OUT_FILE: ${{ runner.temp }}/pr-body-new.md
          PATCH_FILE: ${{ runner.temp }}/pr-body-patch.json
        run: |
          set -euo pipefail
          test -f scripts/ai-review-buttons.mjs

          # Snapshot the live body (not the event payload).
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '(.body // "") | @base64' > "${OUT_FILE}.b64"
          base64 -d < "${OUT_FILE}.b64" > "${OUT_FILE}.in"

          # Single implementation: append when marker missing; regenerate tail when
          # title/URL drift; skip when the generated prompt already matches.
          export BODY_FILE="${OUT_FILE}.in"
          node scripts/ai-review-buttons.mjs

          if cmp -s "${OUT_FILE}.in" "$OUT_FILE"; then
            echo "Body unchanged; nothing to PATCH."
            exit 0
          fi

          # Lost-update guard: re-read immediately before PATCH. If the author
          # (or another actor) changed the body since the snapshot, skip rather
          # than overwrite their edit.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '(.body // "") | @base64' > "${OUT_FILE}.now.b64"
          base64 -d < "${OUT_FILE}.now.b64" > "${OUT_FILE}.now"
          if ! cmp -s "${OUT_FILE}.in" "${OUT_FILE}.now"; then
            echo "Body changed since snapshot; skipping PATCH to avoid a lost update."
            exit 0
          fi

          jq -n --rawfile body "$OUT_FILE" '{body: $body}' > "$PATCH_FILE"
          jq -e 'has("body") and (.body | type == "string")' "$PATCH_FILE" > /dev/null
          # Pipe JSON to stdin; --input <file> is unreliable across gh versions for large bodies.
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --input - < "$PATCH_FILE"
