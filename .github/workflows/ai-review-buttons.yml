# Appends AI review links (Grok, Claude, Codex) to same-repo pull request bodies.
# Markdown shields only: no API call, no review comment, no PR-code checkout.
# Fork PRs skip the job so the default token never writes untrusted bodies.
name: 🤖 AI review buttons

on:
  pull_request:
    types: [opened, reopened, edited]

# One write permission. No secrets. This job does not check out PR code.
permissions:
  contents: read

# Serialize runs per PR so two `edited` events cannot PATCH in parallel.
concurrency:
  group: ai-review-buttons-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  append:
    name: Append AI review buttons
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Only same-repo PRs can be body-written with GITHUB_TOKEN. Fork PRs skip cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      # Event fields go through env, never into the script string (template-injection safe).
      # Body is fetched with gh so large/multiline bodies are not interpolated into the workflow.
      - name: Append AI review buttons
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OUT_FILE: ${{ runner.temp }}/pr-body-new.md
          PATCH_FILE: ${{ runner.temp }}/pr-body-patch.json
        run: |
          set -euo pipefail
          # Snapshot the live body (not the event payload).
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '(.body // "") | @base64' > "${OUT_FILE}.b64"
          base64 -d < "${OUT_FILE}.b64" > "${OUT_FILE}.in"

          # Pure transform lives in scripts/ai-review-buttons.mjs (unit-testable).
          # Keeps author bytes; regenerates the tail when title/url drift; appends when marker missing.
          BODY_FILE="${OUT_FILE}.in" OUT_FILE="$OUT_FILE" \
            node scripts/ai-review-buttons.mjs

          if cmp -s "${OUT_FILE}.in" "$OUT_FILE"; then
            echo "Body unchanged; nothing to PATCH."
            exit 0
          fi

          # Lost-update guard: re-read immediately before PATCH. If the author
          # (or another actor) changed the body since the snapshot, skip rather
          # than overwrite their edit.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '(.body // "") | @base64' > "${OUT_FILE}.now.b64"
          base64 -d < "${OUT_FILE}.now.b64" > "${OUT_FILE}.now"
          if ! cmp -s "${OUT_FILE}.in" "${OUT_FILE}.now"; then
            echo "Body changed since snapshot; skipping PATCH to avoid a lost update."
            exit 0
          fi

          jq -n --rawfile body "$OUT_FILE" '{body: $body}' > "$PATCH_FILE"
          jq -e 'has("body") and (.body | type == "string")' "$PATCH_FILE" > /dev/null
          # Pipe JSON to stdin; --input <file> is unreliable across gh versions for large bodies.
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --input - < "$PATCH_FILE"
