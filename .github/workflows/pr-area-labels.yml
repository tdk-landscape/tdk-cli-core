name: 🏷️ PR area labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Apply labels from changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Apply matching area labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          sync-labels: true

      # Labels applied by the labeler above use GITHUB_TOKEN, which does not
      # trigger a separate `labeled` workflow, so the reviewer request lives here.
      # Skipped on `synchronize` so pushes don't re-request a reviewer who already reviewed.
      - name: Request reviewer for JavaScript and TypeScript PRs
        if: github.event.action != 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REVIEWER: sb123sb123
          LABELS: |
            tech: javascript
            tech: typescript
        run: |
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")

          matched=false
          while IFS= read -r label; do
            if [ "$(jq -r --arg l "$label" '[.labels[].name] | index($l) != null' <<< "$pr")" = "true" ]; then
              matched=true
              break
            fi
          done <<< "$LABELS"

          if [ "$matched" != "true" ]; then
            echo "PR has none of the JavaScript/TypeScript labels; nothing to do."
            exit 0
          fi

          if [ "$(jq -r --arg u "$REVIEWER" '.user.login == $u' <<< "$pr")" = "true" ]; then
            echo "$REVIEWER is the PR author; cannot request them as reviewer."
            exit 0
          fi

          if [ "$(jq -r --arg u "$REVIEWER" '[.requested_reviewers[].login] | index($u) != null' <<< "$pr")" = "true" ]; then
            echo "$REVIEWER is already requested as a reviewer."
            exit 0
          fi

          gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" -f "reviewers[]=$REVIEWER"
          echo "Requested review from $REVIEWER."
