# Runs scripts/verify-smoke.sh through a real `tdk up`: a passing smoke block, then a missing route that must fail with a
# retained record (public URL, status 404, response body). The record directory is uploaded even when the script fails, so a
# later regression can be compared with the last success.
#
# Path-filtered: only runs when the smoke runner, its script, or this workflow changes. Not a required check on main.
name: 💨 Smoke E2E

on:
  pull_request:
    paths:
      - "cli/src/utils/smoke.ts"
      - "cli/src/commands/up.ts"
      - "cli/dist/utils/smoke.js"
      - "cli/dist/commands/up.js"
      - "scripts/verify-smoke.sh"
      - ".github/workflows/smoke-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-e2e:
    name: smoke-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      - name: Verify smoke through tdk up
        env:
          VERIFY_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke-records
        run: scripts/verify-smoke.sh

      # Retention is 14 days; the name carries the run id (and attempt) so runs never overwrite each other.
      - name: Upload smoke records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-records/
          retention-days: 14
          if-no-files-found: error
