# Refreshes docs/journey/map.svg from the `island: ...` issue labels every day.
# Run manually from the Actions tab too.
name: 🗺️ journey map

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    name: 🗺️ Refresh map
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write # push the refreshed SVG to the journey-map branch
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked] needed to push the journey-map branch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/journey-map.mjs "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      # `main` is protected (required status checks), and a bot push carries none, so the map is published to
      # its own unprotected `journey-map` branch instead. docs/journey/README.md embeds it from there.
      - name: Publish refreshed map to the journey-map branch
        run: |
          git fetch origin journey-map || true
          if git cat-file -e origin/journey-map:docs/journey/map.svg 2>/dev/null \
            && git show origin/journey-map:docs/journey/map.svg | cmp -s - docs/journey/map.svg; then
            echo "Map unchanged."
          else
            cp docs/journey/map.svg "$RUNNER_TEMP/map.svg"
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            # The branch holds only the SVG (no history of main), so it never goes stale or drifts from main.
            git checkout --orphan journey-map
            git rm -rf -q --cached .
            git clean -fdxq
            mkdir -p docs/journey
            cp "$RUNNER_TEMP/map.svg" docs/journey/map.svg
            git add docs/journey/map.svg
            git commit -m "chore: refresh journey map"
            git push --force origin journey-map
          fi
