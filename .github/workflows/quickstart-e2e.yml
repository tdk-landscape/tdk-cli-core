# Runs the README quickstart against the published npm package on a clean
# machine: install, scaffold a backend, `tdk up`, and wait for its /health
# URL to answer through Traefik. Nightly and on demand from the Actions tab.
name: 🧭 Quickstart E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  quickstart:
    name: 🧭 README quickstart on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash

      # ubuntu-latest ships a Postgres service already listening on 5432,
      # which collides with the one TDK generates and fails tdk doctor's
      # host-port check before tdk up ever runs. Stopping it wasn't enough -
      # it came back a few steps later, most likely via socket activation or
      # a systemd Restart= policy - so mask both the service and socket
      # units (stops systemd from ever bringing them back this boot) before
      # killing whatever is currently bound, and verify right before the
      # step that actually needs the port, not just here.
      - name: Free port 5432 (runner's preinstalled Postgres)
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo systemctl mask postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl mask postgresql.service 'postgresql@*.service' 2>/dev/null || true
          for _ in 1 2 3 4 5; do
            sudo fuser -k 5432/tcp 2>/dev/null || true
            sleep 2
            sudo ss -ltn 2>/dev/null | grep -q ':5432 ' || break
          done
          if sudo ss -ltn 2>/dev/null | grep -q ':5432 '; then
            echo "::error::port 5432 is still in use"
            sudo ss -ltnp | grep ':5432 ' || true
            exit 1
          fi

      - name: Install TDK from npm
        run: npm install -g @tdk-landscape/tdk-cli-core@latest && tdk --version # zizmor: ignore[adhoc-packages] the point is to test what users install

      - name: tdk doctor (machine only)
        run: tdk doctor

      - name: Scaffold the quickstart project
        run: |
          if sudo ss -ltn 2>/dev/null | grep -q ':5432 '; then
            echo "::warning::port 5432 was rebound after the earlier free-port step; killing it again"
            sudo fuser -k 5432/tcp 2>/dev/null || true
            sleep 2
          fi
          mkdir -p "$RUNNER_TEMP/shop" && cd "$RUNNER_TEMP/shop"
          tdk project --yes
          printf 'y\n' | tdk resource orders-api --type backend --stack shop
          tdk doctor

      - name: tdk up and wait for /health
        run: |
          cd "$RUNNER_TEMP/shop"
          tdk up shop > up.log 2>&1 &
          for _ in $(seq 1 60); do
            url="$(grep -oE 'https?://[^ ]*orders[^ ]*/health' up.log | head -1 || true)"
            [ -n "$url" ] && break
            sleep 2
          done
          [ -n "$url" ] || { cat up.log; echo "::error::tdk up never printed the orders-api URL"; exit 1; }
          echo "Waiting for $url"
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 5 "$url"; then echo; echo "Healthy: $url"; exit 0; fi
            sleep 10
          done
          tail -200 up.log
          echo "::error::$url did not become healthy within 20 minutes"
          exit 1

      - name: tdk down
        if: always()
        run: |
          cd "$RUNNER_TEMP/shop"
          tdk down || true
