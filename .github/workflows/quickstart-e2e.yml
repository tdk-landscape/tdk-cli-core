# Runs the README quickstart against the published npm package on a clean
# machine: install, scaffold a backend, `tdk up`, and wait for its /health
# URL to answer through Traefik. Runs after every release, nightly, and on
# demand from the Actions tab.
name: 🧭 Quickstart E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  # Prove each release boots as soon as it is published. Read-only token, no
  # secrets, main branch only, and it checks out main itself rather than the
  # triggering run's ref, so nothing untrusted is executed.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release binaries and npm package"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Releases can land minutes apart, and a boot takes several minutes. Run one at
# a time and never cancel one mid-boot: a cancelled run proves nothing. GitHub
# keeps at most one queued run, so a burst of releases collapses to the latest.
concurrency:
  group: quickstart-e2e
  cancel-in-progress: false

jobs:
  quickstart:
    name: 🧭 README quickstart on a clean machine
    # A failed release publishes nothing, so there is nothing to boot.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # After a release, test exactly the version that was just published
      # (main's package.json holds it: the release commits its own bump). Any
      # other trigger tests whatever npm serves as latest.
      - name: Choose the version to test
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            version="$(node -p "require('./package.json').version")"
          else
            version="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing @tdk-landscape/tdk-cli-core@$version"
      - uses: oven-sh/setup-bun@v2

      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash

      # ubuntu-latest ships a Postgres service already listening on 5432,
      # which collides with the one TDK generates and fails tdk doctor's
      # host-port check before tdk up ever runs. Stopping and even masking
      # the systemd units didn't stick - the port was taken again a few
      # steps and ~15s later, so something outside systemd's unit table is
      # restarting it (runner provisioning finishing in the background is
      # the leading suspect on GitHub-hosted runners). Removing the package
      # outright is the one thing nothing can undo for the rest of the job.
      - name: Free port 5432 (runner's preinstalled Postgres)
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' 2>&1 | sudo tee /tmp/pg-purge.log > /dev/null || true
          sudo fuser -k 5432/tcp 2>/dev/null || true
          sleep 2
          if sudo ss -ltn 2>/dev/null | grep -q ':5432 '; then
            echo "::error::port 5432 is still in use after purging postgresql"
            sudo ss -ltnp | grep ':5432 ' || true
            tail -50 /tmp/pg-purge.log || true
            exit 1
          fi
          echo "port 5432 is free"

      - name: Install TDK from npm
        env:
          TDK_VERSION: ${{ steps.version.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages] the point is to test what users install
          if [ "$TDK_VERSION" != "latest" ]; then
            # npm's registry can lag a minute or two behind the publish.
            for _ in $(seq 1 30); do
              npm view "@tdk-landscape/tdk-cli-core@${TDK_VERSION}" version --prefer-online >/dev/null 2>&1 && break
              sleep 10
            done
          fi
          npm install -g "@tdk-landscape/tdk-cli-core@${TDK_VERSION}"
          tdk --version

      - name: tdk doctor (machine only)
        run: tdk doctor

      - name: Scaffold the quickstart project
        run: |
          if sudo ss -ltn 2>/dev/null | grep -q ':5432 '; then
            echo "::warning::port 5432 is in use again right before scaffolding; here's what's on it"
            sudo ss -ltnp | grep ':5432 ' || true
            sudo fuser -k 5432/tcp 2>/dev/null || true
            sleep 2
          fi
          mkdir -p "$RUNNER_TEMP/shop" && cd "$RUNNER_TEMP/shop"
          tdk project --yes
          printf 'y\n' | tdk resource orders-api --type backend --stack shop
          tdk doctor

      - name: tdk up and wait for /health
        run: |
          cd "$RUNNER_TEMP/shop"
          tdk up shop > up.log 2>&1 &
          for _ in $(seq 1 60); do
            url="$(grep -oE 'https?://[^ ]*orders[^ ]*/health' up.log | head -1 || true)"
            [ -n "$url" ] && break
            sleep 2
          done
          [ -n "$url" ] || { cat up.log; echo "::error::tdk up never printed the orders-api URL"; exit 1; }
          echo "Waiting for $url"
          for n in $(seq 1 120); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)"
            case "$code" in
              2??) echo "Healthy: $url (HTTP $code after $((n * 10))s)"; curl -s --max-time 5 "$url"; echo; exit 0 ;;
            esac
            echo "poll $n ($((n * 10))s): HTTP $code"
            # Once a minute, show what is actually happening so a slow first boot
            # can be told apart from a container that never turns healthy.
            if [ $((n % 6)) -eq 0 ]; then
              echo "::group::progress at $((n * 10))s"
              docker ps -a --format 'table {{.Names}}\t{{.Status}}' | head -20 || true
              echo "-- images built so far:"
              docker images --format '{{.Repository}}:{{.Tag}}  {{.CreatedSince}}' | head -12 || true
              echo "-- tilt resources (name, update, runtime, what it is waiting on):"
              tilt get uiresources -o json 2>/dev/null | jq -r '.items[] | "\(.metadata.name)  update=\(.status.updateStatus // "-")  runtime=\(.status.runtimeStatus // "-")  waiting=\(.status.waiting // {} | tostring)  err=\((.status.buildHistory // [] | map(.error // empty) | first) // "-")"' || echo "(tilt not reachable)"
              echo "-- tdk up log (last 8 lines):"
              tail -8 up.log || true
              echo "::endgroup::"
            fi
            sleep 10
          done
          tail -200 up.log
          echo "::error::$url did not become healthy within 20 minutes"
          exit 1

      # When the health poll times out, "404 for 20 minutes" says nothing about
      # why. Dump what a person would look at first.
      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: |
          cd "$RUNNER_TEMP/shop" 2>/dev/null || exit 0
          echo "::group::tdk up log (last 300 lines)"
          tail -300 up.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::docker ps -a"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          echo "::endgroup::"
          for c in $(docker ps -a --format '{{.Names}}' | grep -iE 'orders|traefik' || true); do
            echo "::group::docker logs $c (last 100 lines)"
            docker logs --tail 100 "$c" 2>&1 || true
            echo "::endgroup::"
          done
          echo "::group::docker images"
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.CreatedSince}}' | head -20 || true
          echo "::endgroup::"
          echo "::group::tilt resources"
          tilt get uiresources 2>&1 | head -40 || true
          echo "::endgroup::"
          echo "::group::tdk doctor"
          tdk doctor || true
          echo "::endgroup::"

      - name: tdk down
        if: always()
        run: |
          cd "$RUNNER_TEMP/shop"
          tdk down || true
