name: Release binaries and npm package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "cli/package.json"

permissions:
  contents: write # push the automatic version bump back to main
  id-token: write

# Queue releases instead of running them side by side: two runs for the same
# version upload the same assets and one fails with "already exists".
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest # zizmor: ignore[adhoc-packages] trusted publishing needs a current npm

      - run: bun install --frozen-lockfile
        working-directory: cli

      # This workflow runs on every package.json change, not only version
      # bumps. A dependency update or other package.json edit used to rebuild
      # the binaries from new code and re-upload them over the release that
      # already had this version, while npm skipped it as "already published":
      # new code under an old version number. Instead, move to the next patch
      # version that is neither on npm nor a tdk-cli-releases tag. Must run
      # before the build: the CLI reads its version from cli/package.json.
      - name: Pick an unreleased version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(node -p "require('./package.json').version")
          version="$current"
          while npm view "@tdk-landscape/tdk-cli-core@${version}" version >/dev/null 2>&1 \
            || gh release view "v${version}" --repo tdk-landscape/tdk-cli-releases >/dev/null 2>&1; do
            version=$(node -p 'const [a, b, c] = process.argv[1].split(".").map(Number); [a, b, c + 1].join(".")' "$version")
          done
          if [ "$version" = "$current" ]; then
            echo "Releasing ${version}."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${current} is already released; releasing this commit as ${version}."
            # Edit only the version line: `npm version` would reinstall the
            # workspaces and touch the bun-installed node_modules.
            node -e '
              const fs = require("fs");
              for (const file of ["package.json", "cli/package.json"]) {
                const before = fs.readFileSync(file, "utf8");
                const after = before.replace(/("version":\s*")[^"]+"/, (_, key) => key + process.argv[1] + "\"");
                if (after === before) throw new Error("no version field in " + file);
                fs.writeFileSync(file, after);
              }
            ' "$version"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # cli/bin/tdk.js loads cli/dist/cli.js, so the npm package is broken
      # unless the CLI is compiled before `npm publish`.
      - run: npm run build

      - run: scripts/release-binaries.sh --publish
        env:
          GH_TOKEN: ${{ secrets.BINARY_RELEASE_TOKEN }}

      - name: Verify Windows release binary
        run: test -s "release-dist-${VERSION}/tdk-windows-amd64.exe"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # The root package is the public package. It owns the tdk bin entry and
      # already contains the compiled CLI plus the bundled engine assets.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tdk-landscape/tdk-cli-core@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "@tdk-landscape/tdk-cli-core@${PKG_VERSION} is already published, skipping."
          else
            npm publish --access public --provenance
          fi

      # Keep main in step with what was published. A push made with
      # github.token doesn't trigger workflows, so this can't loop. If it
      # fails, the release is still out; the next run bumps past it anyway.
      - name: Commit the version bump
        if: steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # CHANGELOG versions match npm: file the "Unreleased" entries under
          # this version, leaving an empty "Unreleased" section above it.
          node -e '
            const fs = require("fs");
            const [version, date] = process.argv.slice(1);
            if (!fs.existsSync("CHANGELOG.md")) process.exit(0);
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            const start = lines.indexOf("## Unreleased");
            if (start === -1) process.exit(0);
            let end = lines.findIndex((l, i) => i > start && l.startsWith("## "));
            if (end === -1) end = lines.length;
            if (!lines.slice(start + 1, end).some((l) => l.trim())) process.exit(0);
            lines.splice(start + 1, 0, "", "## " + version + " (" + date + ")");
            fs.writeFileSync("CHANGELOG.md", lines.join("\n"));
          ' "$VERSION" "$(date -u +%F)"
          git add package.json cli/package.json
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          git commit -m "Release ${VERSION} (automatic version bump)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push "$remote" HEAD:main; then
            git fetch --depth=50 "$remote" main
            if ! { git rebase FETCH_HEAD && git push "$remote" HEAD:main; }; then
              echo "::warning::Released ${VERSION}, but main changed and the version bump could not be pushed. Make sure package.json and cli/package.json on main are ${VERSION} or higher."
            fi
          fi
