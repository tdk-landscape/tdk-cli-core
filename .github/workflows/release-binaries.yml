name: Release binaries and npm package

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "cli/package.json"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
        working-directory: cli

      - run: scripts/release-binaries.sh --publish
        env:
          GH_TOKEN: ${{ secrets.BINARY_RELEASE_TOKEN }}

      # The root package is the public package. It owns the tdk bin entry and
      # already contains the compiled CLI plus the bundled engine assets.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tdk-landscape/tdk-cli-core@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "@tdk-landscape/tdk-cli-core@${PKG_VERSION} is already published, skipping."
          else
            npm publish --access public --provenance
          fi
