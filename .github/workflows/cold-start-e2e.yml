# Exercises the licensed `sablier.deferStart` path through a real generated
# project, Tilt, Docker Compose, Traefik, the wake gateway, and the backend.
# This deliberately does not run on pull_request: it needs a premium license
# secret, and PR code must not be able to read that secret.
name: 🧊 Deferred cold-start E2E

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to test (local checkout if empty; latest or exact version also accepted)"
        type: string
        default: ""
  schedule:
    - cron: "0 7 * * 3"
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release binaries and npm package"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cold-start-e2e
  cancel-in-progress: false

jobs:
  cold-start:
    name: 🧊 Wake a deferred backend during bring-up
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TDK_LICENSE_KEY: ${{ secrets.TDK_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Require the Sablier CI license
        run: |
          if [ -z "$TDK_LICENSE_KEY" ]; then
            echo "::error::Configure the TDK_LICENSE_KEY Actions secret with a key granting sablier to run this licensed end-to-end test."
            exit 1
          fi

      - name: Choose the CLI version to test
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            version="$(node -p "require('./package.json').version")"
          elif [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="local"
          else
            version="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing @tdk-landscape/tdk-cli-core@$version"

      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash

      - name: Free port 5432 (runner's preinstalled Postgres)
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' 2>&1 | sudo tee /tmp/pg-purge.log > /dev/null || true
          sudo fuser -k 5432/tcp 2>/dev/null || true
          sleep 2
          if sudo ss -ltn 2>/dev/null | grep -q ':5432 '; then
            sudo ss -ltnp | grep ':5432 ' || true
            echo "::error::port 5432 is still in use"
            exit 1
          fi

      - name: Install TDK
        env:
          TDK_VERSION: ${{ steps.version.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages] the scenario tests the locally packed CLI or a selected published release
          if [ "$TDK_VERSION" = "local" ]; then
            tarball="$(npm pack --ignore-scripts --silent | tail -1)"
            npm install -g "./$tarball"
          else
            if [ "$TDK_VERSION" != "latest" ]; then
              # The release workflow can complete before npm has propagated
              # the package version to the registry.
              for _ in $(seq 1 30); do
                npm view "@tdk-landscape/tdk-cli-core@${TDK_VERSION}" version --prefer-online >/dev/null 2>&1 && break
                sleep 10
              done
            fi
            npm install -g "@tdk-landscape/tdk-cli-core@${TDK_VERSION}"
          fi
          tdk --version

      - name: Run the deferred cold-start scenario
        run: |
          mkdir -p "$RUNNER_TEMP/tdk-cold-start"
          scripts/e2e/cold-start.sh "$RUNNER_TEMP/tdk-cold-start"

      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: |
          project="$RUNNER_TEMP/tdk-cold-start"
          echo "::group::tdk up log"
          tail -200 "$project/up.log" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::tdk doctor log"
          cat "$project/doctor.log" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Docker containers"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          echo "::endgroup::"
          echo "::group::Tilt resources"
          tilt get uiresources -o wide 2>&1 | head -100 || true
          echo "::endgroup::"

      - name: Stop TDK project
        if: always()
        run: |
          cd "$RUNNER_TEMP/tdk-cold-start" 2>/dev/null || exit 0
          tdk down || true
