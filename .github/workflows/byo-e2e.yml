name: BYO Python dry-run E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cli/src/commands/resource.ts"
      - "cli/src/commands/up.ts"
      - "engine/schemas/service-schema.json"
      - "tests/e2e/fixtures/byo-python-health/**"
      - "tests/e2e/byo-python.test.sh"
      - ".github/workflows/byo-e2e.yml"

permissions:
  contents: read

concurrency:
  group: byo-e2e${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  byo-python:
    name: BYO Python resource contract (no Docker or Tilt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Pack and install this checkout's CLI
        working-directory: cli
        run: | # zizmor: ignore[adhoc-packages] installs the checkout's packed CLI
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global "$RUNNER_TEMP"/tdk-cli-internal-*.tgz
          tdk --version

      - name: Install JSON Schema validator
        run: npm install --global ajv-cli@5.0.0 # zizmor: ignore[adhoc-packages] pins the validator used by the contract test

      - name: Exercise BYO Python dry-run contract
        run: bash tests/e2e/byo-python.test.sh
