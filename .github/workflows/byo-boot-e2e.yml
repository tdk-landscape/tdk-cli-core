name: BYO Python boot E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  byo-python-boot:
    name: BYO Python boot and health
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash

      # ubuntu-latest ships a Postgres service already listening on 5432,
      # which collides with the one TDK generates and fails tdk doctor's
      # host-port check before tdk up ever runs. Removing the package keeps
      # the port free for this job.
      - name: Free port 5432 (runner's preinstalled Postgres)
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' 2>&1 | sudo tee /tmp/pg-purge.log > /dev/null || true
          sudo fuser -k 5432/tcp 2>/dev/null || true
          sleep 2
          if sudo ss -ltn 2>/dev/null | grep -q ':5432 '; then
            echo "::error::port 5432 is still in use after purging postgresql"
            sudo ss -ltnp | grep ':5432 ' || true
            tail -50 /tmp/pg-purge.log || true
            exit 1
          fi
          echo "port 5432 is free"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Pack and install this checkout's CLI
        working-directory: cli
        run: | # zizmor: ignore[adhoc-packages] installs the checkout's packed CLI
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global "$RUNNER_TEMP"/tdk-cli-internal-*.tgz
          tdk --version

      - name: Install JSON Schema validator
        run: npm install --global ajv-cli@5.0.0 # zizmor: ignore[adhoc-packages] pins the validator used by the contract test

      - name: Boot BYO Python fixture
        run: bash tests/e2e/byo-python-boot.test.sh

      - name: Cleanup and diagnostics
        if: always()
        run: |
          project_dir="${RUNNER_TEMP}/tdk-byo-python-boot"
          cd "$project_dir" 2>/dev/null || exit 0
          tdk down || true
          echo "::group::tdk up log (last 100 lines)"
          tail -100 up.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::docker ps -a"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          echo "::endgroup::"
          for container in $(docker ps -a --format '{{.Names}}' | grep -i legacy || true); do
            echo "::group::docker logs $container (last 80 lines)"
            docker logs --tail 80 "$container" 2>&1 || true
            echo "::endgroup::"
          done
          echo "::group::tilt resources"
          tilt get uiresources 2>&1 | head -40 || true
          echo "::endgroup::"
