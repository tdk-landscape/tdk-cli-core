name: Publish tdk-import

# tdk-import lives in tdk-landscape/tdk-import but is published with this repo's NPM_TOKEN,
# the only place the secret is set. Run manually with a tag of that repo (for example v0.1.0).
# Leave "dry_run" on first to check what would be published.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "tdk-import tag to publish (must equal v<version in its package.json>)"
        required: true
        type: string
      dry_run:
        description: "npm publish --dry-run (nothing is published)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tdk-landscape/tdk-import
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Tag matches package.json
        env:
          REF: ${{ inputs.ref }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$REF" != "v$VERSION" ]; then
            echo "::error::Tag $REF does not match package.json version v$VERSION"
            exit 1
          fi

      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      # No --provenance: the attestation would name this repo's workflow, not tdk-import's source.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, skipping."
            exit 0
          fi
          # dist/ was built by `npm install` (prepare) above; do not run package scripts again with the token in the environment.
          FLAGS="--access public --ignore-scripts"
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          # shellcheck disable=SC2086
          npm publish $FLAGS # zizmor: ignore[use-trusted-publishing] new package: no trusted publisher exists until after the first publish
