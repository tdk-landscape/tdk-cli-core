# OpenSSF Scorecard: scores the repo's security practices and publishes the result for the README badge.
# Needs no account or secret; results are published with the workflow's OIDC token.
name: 🏅 Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: 🏅 Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF results
      id-token: write # publish results for the badge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: scorecard
