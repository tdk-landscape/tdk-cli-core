name: npm downloads graph
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
jobs:
  graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/npm-downloads-graph.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh npm downloads graph"
          file_pattern: docs/npm-downloads.svg
