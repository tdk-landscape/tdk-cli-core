name: Sync shared TDK skills

on:
  workflow_dispatch:
  repository_dispatch:
    types: [tdk-skills-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: tdk-landscape/tdk-skills
          path: .tmp-tdk-skills
      - name: Sync plugin metadata and skills
        run: TDK_SKILLS_REPO="$GITHUB_WORKSPACE/.tmp-tdk-skills" scripts/sync-tdk-skills.sh
      - name: Commit sync if changed
        run: |
          rm -rf .tmp-tdk-skills
          if git diff --quiet; then
            echo "Skills are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin .claude/skills
          git commit -m "Sync shared TDK skills"
          git push
