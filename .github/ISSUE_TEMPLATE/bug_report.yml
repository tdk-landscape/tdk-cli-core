name: Bug report
description: Something in tdk does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: request-scope
    attributes:
      label: Is this a local-development or cluster-deployment issue?
      options:
        - Local development with Docker + Tilt
        - Cluster deployment (Helm, Kustomize, Flux, or Argo)
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. tdk project --yes
        2. tdk up api
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `tdk doctor`
      render: shell
  - type: input
    id: version
    attributes:
      label: TDK version
      description: Output of `tdk --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Linux, Windows (WSL), Other]
    validations:
      required: true

  - type: markdown
    attributes:
      value: >-
        TDK runs local development on Docker + Tilt. For cluster deployments, keep
        your Helm or other Kubernetes workflow. See [TDK + Helm](https://github.com/tdk-landscape/tdk-cli-core/blob/main/docs/with-helm.md).
