name: I booted TDK
description: Share evidence from your first TDK run
title: "boot: "
labels: [show-and-tell]
body:
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, Windows 11 with WSL2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TDK version
      placeholder: Output of `tdk --version`
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: Minutes to first boot
      placeholder: For example, 8
    validations:
      required: true
  - type: textarea
    id: broke
    attributes:
      label: What broke?
      description: Include the relevant output or error.
    validations:
      required: true
  - type: textarea
    id: cmd
    attributes:
      label: Command you ran
      description: Include whether this was a fresh install or an existing project.
      render: shell
    validations:
      required: true
