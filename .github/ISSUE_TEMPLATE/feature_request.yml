name: Feature request
description: Suggest an idea or improvement for TDK
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like TDK to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
