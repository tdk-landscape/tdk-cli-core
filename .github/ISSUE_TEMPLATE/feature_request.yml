name: Feature request
description: Suggest an idea or improvement for TDK
labels: [enhancement]
body:
  - type: dropdown
    id: request-scope
    attributes:
      label: Is this a local-development or cluster-deployment request?
      options:
        - Local development with Docker + Tilt
        - Cluster deployment (Helm, Kustomize, Flux, or Argo)
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like TDK to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: markdown
    attributes:
      value: >-
        TDK runs local development on Docker + Tilt. For cluster deployments, keep
        your Helm or other Kubernetes workflow. See [TDK + Helm](https://github.com/tdk-landscape/tdk-cli-core/blob/main/docs/with-helm.md).
