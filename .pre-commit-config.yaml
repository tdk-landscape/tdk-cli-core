repos:
  - repo: local
    hooks:
      # Fast unit tests for Docker/Compose generators
      - id: pytest-fast-tests
        name: Run fast unit tests
        entry: python3 -m pytest -m fast --no-cov -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        description: |
          Fast tests only (marked with @pytest.mark.fast):
          - Docker/Compose generator bug tests
          - Port anchor selection (*backend-port vs *frontend-port)
          - EXPOSE validation (port numbers, not paths)
          - Function signature validation (keyword args)
          These are pure Python tests (no Tilt/Docker needed) and run in ~1s.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ".autogenerated/"
      - id: check-json
        exclude: ".autogenerated/"
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        files: \.py$
        exclude: ".autogenerated/|__pycache__/"

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: \.py$
        exclude: ".autogenerated/|__pycache__/"
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  # Optional: Run on Starlark files (Tilt/Starlark syntax check)
  - repo: local
    hooks:
      - id: check-star-syntax
        name: Check Starlark file syntax
        entry: python3 -c "import ast; [ast.parse(open(f).read()) for f in __import__('sys').argv[1:]]"
        language: system
        files: \.star$
        pass_filenames: true
        description: Basic Python syntax validation for Starlark files
