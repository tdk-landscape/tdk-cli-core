services:
  nats:
    image: nats:2.10-alpine
    container_name: tdk_example_nats
    command: ["--jetstream", "--http_port", "8222"]
    restart: unless-stopped
    networks:
      tdk_example_backend:
        aliases:
          - tdk_example_nats
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  tdk_example_backend:
    external: true
    name: tdk_example_backend
